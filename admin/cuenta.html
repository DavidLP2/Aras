<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Mi cuenta | ARAS</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            color: #28221e;
            background: #fff;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        main {
            width: min(100%, 560px);
            padding: 40px 32px;
            border: 1px solid #e8ded4;
            border-radius: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 16px;
            font-family: Georgia, serif;
            font-size: clamp(28px, 6vw, 38px);
        }

        p {
            color: #655b54;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 12px;
            padding: 13px 22px;
            border-radius: 999px;
            background: #95765e;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>Mi cuenta</h1>
        <p>El acceso a cuentas y el seguimiento de pedidos estará disponible cuando ARAS esté alojado en un servidor seguro compatible con PHP.</p>
        <a href="../">Volver a la tienda</a>
    </main>
</body>
</html>
